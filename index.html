<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>לוח משחקים | 2027</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&family=Rubik:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #172033;
      --muted: #687386;
      --accent: #e95d3f;
      --accent-dark: #b73d2a;
      --cream: #fffaf3;
      --paper: #ffffff;
      --line: #e8e2d9;
      --soft: #f7f1e8;
      --shadow: 0 18px 45px rgba(65, 46, 26, 0.12);
    }

    * { box-sizing: border-box; }

    
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background:
        radial-gradient(circle at 8% 4%, rgba(233, 93, 63, 0.16), transparent 23rem),
        radial-gradient(circle at 92% 18%, rgba(42, 137, 132, 0.12), transparent 22rem),
        var(--cream);
      font-family: "Heebo", "Segoe UI", sans-serif;
    }

    .page {
      width: min(1240px, calc(100% - 36px));
      margin: 0 auto;
      padding: 54px 0 70px;
    }

    .hero {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 28px;
      margin-bottom: 28px;
    }

    .eyebrow {
      margin: 0 0 8px;
      color: var(--accent);
      font-size: 0.82rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-family: "Rubik", "Heebo", sans-serif;
      font-size: clamp(2.3rem, 5vw, 4.6rem);
      line-height: 1;
      letter-spacing: -0.03em;
    }

    .subtitle {
      max-width: 460px;
      margin: 14px 0 0;
      color: var(--muted);
      font-size: 1.05rem;
      line-height: 1.7;
    }

    .season-mark {
      display: block;
      width: 132px;
      height: 132px;
      object-fit: contain;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
      margin-bottom: 22px;
    }

    .stat {
      padding: 18px 20px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.68);
    }

    .stat-value {
      display: block;
      color: var(--accent-dark);
      font-family: "Rubik", sans-serif;
      font-size: 1.65rem;
      font-weight: 800;
    }

    .stat-label {
      display: block;
      margin-top: 2px;
      color: var(--muted);
      font-size: 0.92rem;
    }

    .table-shell {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--paper);
      box-shadow: var(--shadow);
    }

    .copyright {
      margin: 18px 0 0;
      color: var(--muted);
      font-size: 0.86rem;
      text-align: center;
    }

    .table-heading {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 16px;
      padding: 19px 22px;
      border-bottom: 1px solid var(--line);
      background: var(--soft);
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .league-filter {
      min-width: 210px;
      padding: 9px 34px 9px 12px;
      border: 1px solid #d9d0c4;
      border-radius: 6px;
      color: var(--ink);
      background: var(--paper);
      font: inherit;
      font-size: 0.9rem;
      font-weight: 600;
    }

    .league-filter:focus-visible {
      outline: 3px solid rgba(233, 93, 63, 0.25);
      outline-offset: 2px;
    }

    .table-heading h2 {
      margin: 0;
      font-family: "Rubik", sans-serif;
      font-size: 1.15rem;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .badge {
      padding: 5px 11px;
      border-radius: 999px;
      color: #24736e;
      background: #e5f3f0;
      font-size: 0.86rem;
      font-weight: 700;
      white-space: nowrap;
    }

    .table-scroll {
      width: 100%;
      max-width: 100%;
      overflow-x: auto;
      overflow-y: hidden;
      -webkit-overflow-scrolling: touch;
      touch-action: pan-x pan-y;
    }

    table {
      width: 100%;
      min-width: 800px;
      border-collapse: collapse;
      text-align: right;
    }

    th, td {
      padding: 17px 22px;
      border-bottom: 1px solid var(--line);
      white-space: nowrap;
    }

    th {
      color: var(--muted);
      background: #fffdfa;
      font-size: 0.86rem;
      font-weight: 700;
    }

    .sort-button {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 0;
      border: 0;
      color: inherit;
      background: transparent;
      font: inherit;
      cursor: pointer;
    }

    .sort-button:hover,
    .sort-button:focus-visible {
      color: var(--accent-dark);
    }

    .sort-button:focus-visible {
      outline: 3px solid rgba(233, 93, 63, 0.25);
      outline-offset: 4px;
    }

    .sort-indicator {
      color: var(--accent);
      font-size: 0.8rem;
    }

    td {
      font-size: 0.98rem;
      font-weight: 500;
    }

    tbody tr { transition: background 160ms ease; }
    tbody tr:hover { background: #fff7ee; }
    tbody tr.past-game { background: #e8f5e9; }
    tbody tr.past-game:hover { background: #d9efdc; }
    tbody tr.today-game { background: #fff3b0; }
    tbody tr.today-game:hover { background: #ffeb82; }
    tbody tr:last-child td { border-bottom: 0; }

    .date {
      color: var(--accent-dark);
      font-family: "Rubik", sans-serif;
      font-weight: 700;
    }

    .time {
      direction: ltr;
      display: inline-block;
      font-family: "Rubik", sans-serif;
      font-weight: 600;
    }

    .weekday {
      color: var(--muted);
      font-weight: 600;
    }

    .team-home { font-weight: 700; }
    .team-away { color: #465268; }

    .team-link {
      padding: 0;
      border: 0;
      color: inherit;
      background: transparent;
      font: inherit;
      font-weight: inherit;
      text-align: right;
      text-decoration: underline;
      text-decoration-color: rgba(233, 93, 63, 0.45);
      text-underline-offset: 3px;
      cursor: pointer;
    }

    .team-link:hover,
    .team-link:focus-visible { color: var(--accent-dark); }

    .team-link:focus-visible {
      outline: 3px solid rgba(233, 93, 63, 0.25);
      outline-offset: 3px;
    }

    .players-dialog {
      width: min(920px, calc(100% - 28px));
      height: min(760px, calc(100% - 28px));
      padding: 0;
      border: 0;
      border-radius: 10px;
      background: var(--paper);
      box-shadow: 0 24px 70px rgba(23, 32, 51, 0.28);
    }

    .players-dialog::backdrop { background: rgba(23, 32, 51, 0.52); }

    .players-dialog-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 16px 20px;
      border-bottom: 1px solid var(--line);
      background: var(--soft);
    }

    .players-dialog-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .players-external-link {
      color: var(--accent-dark);
      font-size: 0.88rem;
      font-weight: 700;
    }

    .players-dialog-title {
      margin: 0;
      font-family: "Rubik", sans-serif;
      font-size: 1.15rem;
    }

    .dialog-close {
      width: 36px;
      height: 36px;
      border: 1px solid #d9d0c4;
      border-radius: 6px;
      color: var(--ink);
      background: var(--paper);
      font-size: 1.3rem;
      line-height: 1;
      cursor: pointer;
    }

    .dialog-close:hover,
    .dialog-close:focus-visible { color: var(--accent-dark); }

    .players-frame {
      display: block;
      width: 100%;
      height: calc(100% - 69px);
      border: 0;
      background: var(--paper);
    }

    @media (max-width: 680px) {
      .page { width: min(100% - 24px, 1240px); padding-top: 30px; }
      .hero { align-items: start; }
      .season-mark { width: 82px; height: 82px; }
      .stats { gap: 8px; }
      .stat { padding: 13px 12px; }
      .stat-value { font-size: 1.3rem; }
      .stat-label { font-size: 0.78rem; }
      .table-heading { padding: 16px; }
      .table-heading { align-items: stretch; flex-direction: column; }
      .controls { align-items: stretch; flex-direction: column; }
      .league-filter { width: 100%; }
      .table-scroll { overflow-x: hidden; }
      table {
        min-width: 0;
        table-layout: fixed;
      }
      th, td {
        padding: 6px 3px;
        font-size: 0.66rem;
        line-height: 1.25;
        white-space: normal;
        overflow-wrap: anywhere;
      }
      th:nth-child(1), td:nth-child(1) { width: 18%; }
      th:nth-child(2), td:nth-child(2) { width: 11%; }
      th:nth-child(3), td:nth-child(3) { width: 12%; }
      th:nth-child(4), td:nth-child(4) { width: 12%; }
      th:nth-child(5), td:nth-child(5),
      th:nth-child(6), td:nth-child(6) { width: 23.5%; }
      td.date { white-space: nowrap; overflow-wrap: normal; font-size: 0.6rem; }
    }
  </style>
</head>

            </tr>
          </thead>
          <tbody id="games-body"></tbody>
        </table>
      </div>
    </section>
    <p class="copyright">© 2026 מיכאל מסטר. כל הזכויות שמורות.</p>
  </main>

    let games = [];
  let sortKey = 'date';
  let sortDirection = 1;

    function parseGame(line) {
      const fields = line.split(line.includes('\t') ? '\t' : '|').map(field => field.trim());
      const [dateTime, league, home, away] = line.includes('\t')
        ? [fields[0], fields[2], fields[4], fields[6]]
        : fields;
      const [date, time] = dateTime.split(/\s+/);
      const [day, month, year] = date.split('/').map(Number);

      return {
        date: new Date(year, month - 1, day),
        displayDate: `${String(day).padStart(2, '0')}.${String(month).padStart(2, '0')}.${String(year).slice(-2)}`,
        time,
        league: normalizeLeague(league),
        home,
        away
      };
    }

    function normalizeLeague(league) {
      return [
        'ארצית גברים שפלה',
        'ארצית גברים דרום',
        'ארצית גברים יהודה',
        'ליגה ארצית גברים שפלה',
        'ליגה ארצית גברים דרום',
        'ליגה ארצית גברים יהודה'
      ].includes(league)
        ? 'ארצית'
        : league;
    }

    function renderGames() {
      const selectedLeague = leagueFilter.value;
      const selectedTeam = teamFilter.value;
      const selectedVenue = venueFilter.value;
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      const leagueGames = selectedLeague === 'all'
        ? games
        : games.filter(game => game.league === selectedLeague);
      const filteredGames = selectedTeam === 'all'
        ? leagueGames
        : leagueGames.filter(game => game.home === selectedTeam || game.away === selectedTeam);
      const isAshdodHome = game => game.home.includes('אשדוד');
      const isAshdodAway = game => game.away.includes('אשדוד') && !isAshdodHome(game);
      const venueGames = selectedVenue === 'home'
        ? filteredGames.filter(game => selectedTeam === 'all'
          ? isAshdodHome(game)
          : game.home === selectedTeam || game.home.includes('אשדוד'))
        : selectedVenue === 'away'
          ? filteredGames.filter(game => selectedTeam === 'all'
            ? isAshdodAway(game)
            : game.away === selectedTeam && !isAshdodHome(game))
          : filteredGames;
      const sortedGames = [...venueGames].sort(compareGames);
      const isHomeGameForSelectedTeam = selectedTeam === 'all'
        ? isAshdodHome
        : game => game.home === selectedTeam || game.home.includes('אשדוד');

      gamesBody.innerHTML = sortedGames.map(game => `
        <tr class="${game.date < today
          ? 'past-game'
          : game.date.getTime() === today.getTime() ? 'today-game' : ''}">
          <td class="date">${game.displayDate}</td>
          <td><span class="time">${game.time}</span></td>
          <td class="weekday">${game.date.toLocaleDateString('he-IL', { weekday: 'long' }).replace(/^יום\s+/, '')}</td>
          <td>${displayLeague(game.league)}</td>
          <td class="team-home">${renderTeam(game.home)}</td>
          <td class="team-away">${renderTeam(game.away)}</td>
        </tr>
      `).join('');

      gamesBody.querySelectorAll('.team-link').forEach(button => {
        button.addEventListener('click', () => openPlayers(button.dataset.team));
      });

      gamesCount.textContent = venueGames.length;
      homeCount.textContent = selectedVenue === 'away'
        ? 0
        : venueGames.filter(isHomeGameForSelectedTeam).length;
      awayCount.textContent = selectedVenue === 'home'
        ? 0
        : selectedTeam === 'all'
          ? venueGames.filter(isAshdodAway).length
          : venueGames.filter(game => game.away === selectedTeam && !isAshdodHome(game)).length;
      updateSortHeaders();
    }

    function renderTeam(team) {
      return teamPlayerLinks[team]
        ? `<button class="team-link" type="button" data-team="${team}">${team}</button>`
        : team;
    }

    function displayLeague(league) {
      return league === 'לאומית גברים דרום' ? 'לאומית' : league;
    }

    function openPlayers(team) {
      playersDialogTitle.textContent = `שחקני ${team}`;
      playersFrame.src = teamPlayerLinks[team];
      playersFrame.title = `שחקני ${team}`;
      playersExternalLink.href = teamPlayerLinks[team];
      playersDialog.showModal();
    }

    function closePlayers() {
      playersDialog.close();
      playersFrame.src = 'about:blank';
    }

    function compareGames(first, second) {
      const firstValue = getSortValue(first, sortKey);
      const secondValue = getSortValue(second, sortKey);

      if (firstValue < secondValue) return -1 * sortDirection;
      if (firstValue > secondValue) return 1 * sortDirection;
      return 0;
    }

    function getSortValue(game, key) {
      if (key === 'date') return game.date.getTime();
      if (key === 'weekday') return game.date.getDay();
      return game[key].toLocaleLowerCase('he');
    }

    function updateSortHeaders() {
      sortableHeaders.forEach(header => {
        const isActive = header.dataset.sortKey === sortKey;
        const button = header.querySelector('.sort-button');
        const indicator = header.querySelector('.sort-indicator');
        header.setAttribute('aria-sort', isActive
          ? sortDirection === 1 ? 'ascending' : 'descending'
          : 'none');
        button.setAttribute('aria-label', `מיון לפי ${button.textContent.trim()}`);
        indicator.textContent = isActive ? sortDirection === 1 ? '↑' : '↓' : '';
      });
    }

    function loadGames() {
      loadGamesText(embeddedGamesText);
    }

    function loadGamesText(text) {
      games = parseGames(text);
      populateLeagueFilter();
      renderGames();
    }

    function parseGames(text) {
      const records = [];

      text.split(/\r?\n/).map(line => line.trim()).filter(Boolean).forEach(line => {
        if (/^\d{2}\/\d{2}\/\d{4}(?:\s|$)/.test(line)) {
          records.push(line);
        } else if (records.length > 0) {
          records[records.length - 1] += ` ${line}`;
        }
      });

      return records.map(parseGame).sort((first, second) => first.date - second.date);
    }

    function populateLeagueFilter() {
        const selectedLeague = leagueFilter.value;
        const selectedTeam = teamFilter.value;
        const leagueGames = selectedLeague === 'all'
          ? games
          : games.filter(game => game.league === selectedLeague);
        leagueFilter.innerHTML = '<option value="all">כל הליגות</option>';
        const leagueOrder = ['לאומית', 'ארצית', 'ליגה א'];
        [...new Set(games.map(game => game.league))]
          .sort((first, second) => leagueOrder.indexOf(displayLeague(first)) - leagueOrder.indexOf(displayLeague(second)))
          .forEach(league => leagueFilter.add(new Option(displayLeague(league), league)));
        leagueFilter.value = [...leagueFilter.options].some(option => option.value === selectedLeague)
          ? selectedLeague
          : 'all';
        teamFilter.innerHTML = '<option value="all">כל הקבוצות</option>';
        const teamLeagues = new Map();
        leagueGames.forEach(game => {
          [game.home, game.away]
            .filter(team => team.includes('אשדוד'))
            .forEach(team => {
              if (!teamLeagues.has(team)) teamLeagues.set(team, new Set());
              teamLeagues.get(team).add(displayLeague(game.league));
            });
        });
        [...teamLeagues.entries()]
          .sort(([first], [second]) => first.localeCompare(second, 'he'))
          .forEach(([team, leagues]) => {
            teamFilter.add(new Option(`${team} (${[...leagues].join(', ')})`, team));
          });
        teamFilter.value = [...teamFilter.options].some(option => option.value === selectedTeam)
          ? selectedTeam
          : 'all';
    }

    leagueFilter.addEventListener('change', () => {
      populateLeagueFilter();
      renderGames();
    });
    teamFilter.addEventListener('change', renderGames);
    venueFilter.addEventListener('change', renderGames);
    dialogClose.addEventListener('click', closePlayers);
    playersDialog.addEventListener('click', event => {
      if (event.target === playersDialog) closePlayers();
    });
    sortableHeaders.forEach(header => {
      header.querySelector('.sort-button').addEventListener('click', () => {
        if (sortKey === header.dataset.sortKey) {
          sortDirection *= -1;
        } else {
          sortKey = header.dataset.sortKey;
          sortDirection = 1;
        }
        renderGames();
      });
    });
    loadGames();
  </script>
